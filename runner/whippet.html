<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Уиппет: мастерская</title>
<style>
  :root { --bg: #ece7df; --ink: #1d1a17; --dim: #6d655c; --acc: #b0562c; --panel: rgba(255, 255, 255, .82); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: grid; gap: 8px; background: linear-gradient(transparent, rgba(236, 231, 223, .95) 30%); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button { font: inherit; padding: 8px 12px; border-radius: 999px; border: 1px solid #cfc6bb; background: var(--panel); color: var(--ink); cursor: pointer; }
  button.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  label { color: var(--dim); font-size: 12px; }
  input[type=range] { flex: 1; min-width: 140px; accent-color: var(--acc); }
  #info { position: fixed; top: 10px; left: 12px; right: 12px; font-size: 12px; color: var(--dim); }
  #info b { color: var(--ink); font-size: 16px; display: block; }
  a { color: var(--acc); }
</style>
</head>
<body>
<div id="info"><b>Уиппет — мастерская модели</b><span id="stat">…</span> · крути вид пальцем/мышью · <a href="./#runner">в игру</a></div>
<div id="ui">
  <div class="row" id="gaits">
    <button data-v="0">Стоит</button><button data-v="1.2">Шаг</button><button data-v="3.6">Рысь</button><button data-v="10">Галоп</button><button data-v="16">Полный галоп</button>
  </div>
  <div class="row"><label>скорость</label><input id="speed" type="range" min="0" max="16" step="0.1" value="0"><span id="sv">0</span></div>
  <div class="row">
    <button id="jump">Прыжок</button><button id="flip">Сальто</button><button id="crash">Падение</button><button id="limp">Хромота</button><button id="slow">Замедлить</button>
    <button id="turn">Поворот</button><button id="cam">Вид</button>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/whippet.js"></script>
<script>
(function () {
  const R = window.R;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xece7df);
  scene.fog = new THREE.Fog(0xece7df, 9, 22);
  const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 60);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb8a58f, 0.9));
  const sun = new THREE.DirectionalLight(0xfff3e2, 1.6);
  sun.position.set(3, 6, 2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 20 });
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // treadmill floor: terracotta show-ring with moving stripes, so the paws can be checked for sliding
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = '#c9785a'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#bd6c4e'; g.fillRect(0, 0, 64, 6);
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(20, 20);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  const dog = R.makeWhippet();
  const holder = new THREE.Group(); holder.add(dog.root); scene.add(holder);
  const flipper = new THREE.Group(); // the somersault turns the whole dog round its middle
  holder.remove(dog.root); flipper.position.y = 0.42; dog.root.position.y = -0.42; flipper.add(dog.root); holder.add(flipper);

  const S = { speed: 0, target: 0, y: 0, vy: 0, air: false, flip: -1, crash: -1, limp: 0, turn: 0, turning: false, slow: 1, land: 0 };
  let yaw = 0.9, pitch = 0.18, dist = 3.6, camMode = 0, view = null;
  const $ = id => document.getElementById(id);
  const setSpeed = v => { S.target = +v; $('speed').value = v; $('sv').textContent = (+v).toFixed(1) + ' м/с'; document.querySelectorAll('#gaits button').forEach(b => b.classList.toggle('on', +b.dataset.v === +v)); };
  document.querySelectorAll('#gaits button').forEach(b => b.onclick = () => setSpeed(b.dataset.v));
  $('speed').oninput = e => setSpeed(e.target.value);
  $('jump').onclick = () => { if (!S.air) { S.vy = 9.4; S.air = true; } };
  $('flip').onclick = () => { if (!S.air) { S.vy = 9.4; S.air = true; setTimeout(() => { S.vy = 7.5; S.flip = 0; }, 330); } else { S.vy = 7.5; S.flip = 0; } };
  $('crash').onclick = () => { S.crash = 0; S.limp = 1; $('limp').classList.add('on'); };
  $('limp').onclick = () => { S.limp = S.limp > 0 ? 0 : 1; $('limp').classList.toggle('on', S.limp > 0); };
  $('slow').onclick = () => { S.slow = S.slow === 1 ? 0.25 : 1; $('slow').classList.toggle('on', S.slow < 1); };
  $('turn').onclick = () => { S.turning = !S.turning; $('turn').classList.toggle('on', S.turning); };
  const CAMS = [[0.9, 0.18, 3.6], [Math.PI / 2, 0.05, 3.4], [0, 0.12, 3.4], [2.4, 0.3, 3.8]];
  $('cam').onclick = () => { camMode = (camMode + 1) % CAMS.length; [yaw, pitch, dist] = CAMS[camMode]; };
  let drag = null;
  renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw, pitch }; });
  addEventListener('pointermove', e => { if (!drag) return; yaw = drag.yaw - (e.clientX - drag.x) * 0.008; pitch = R.clamp(drag.pitch + (e.clientY - drag.y) * 0.006, -0.1, 1.2); });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('wheel', e => { dist = R.clamp(dist + e.deltaY * 0.002, 1.2, 8); });

  let last = performance.now(), fpsT = 0, fpsN = 0;
  function step(dt) {
    dt *= S.slow;
    S.speed = R.damp(S.speed, S.crash >= 0 ? 0 : S.limp > 0.4 ? Math.min(S.target, 5.5) : S.target, 1.6, dt);
    S.turn = R.damp(S.turn, S.turning ? 1.2 : 0, 4, dt);
    if (S.air) {
      S.vy -= 22 * dt * (Math.abs(S.vy) < 2.4 ? 0.55 : 1); S.y += S.vy * dt;
      if (S.y <= 0) { S.land = -S.vy; S.y = 0; S.vy = 0; S.air = false; if (S.flip >= 0 && S.flip < 0.85) { S.crash = 0; S.limp = 1; $('limp').classList.add('on'); } S.flip = -1; }
    }
    if (S.flip >= 0) { S.flip = Math.min(1, S.flip + dt / 0.55); const e = S.flip < 0.5 ? 2 * S.flip * S.flip : 1 - Math.pow(-2 * S.flip + 2, 2) / 2; flipper.rotation.x = -e * Math.PI * 2; if (S.flip >= 1) { S.flip = -1; flipper.rotation.x = 0; } }
    if (S.crash >= 0) { S.crash += dt / 1.4; if (S.crash >= 1) S.crash = -1; }
    holder.position.y = S.y;
    holder.rotation.y += -S.turn * dt * (S.speed > 0.5 ? 1 : 0);
    tex.offset.y += 0; // the floor moves under the dog instead of the dog moving
    const fx = -Math.sin(holder.rotation.y), fz = -Math.cos(holder.rotation.y);
    tex.offset.x -= fx * S.speed * dt / 2; tex.offset.y += fz * S.speed * dt / 2;
    dog.update(dt, { speed: S.speed, speed01: S.speed / 16, air: S.air, vy: S.vy, turn: S.turn * (S.speed > 0.5 ? 1 : 0), flip: S.flip, crash: S.crash, limp: S.limp, land: S.land });
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt);
    render();
    fpsN++; fpsT += dt; if (fpsT > 0.5) { $('stat').textContent = Math.round(fpsN / fpsT) + ' fps · фаза ' + dog.phase.toFixed(2); fpsT = 0; fpsN = 0; }
  }
  function render() {
    // on a narrow (phone) screen step back so the whole dog fits, and keep it above the buttons
    const k = Math.max(1, 1.3 / camera.aspect), d = dist * k;
    const tgt = new THREE.Vector3(0, (k > 1 ? 0.3 : 0.55) + S.y * 0.7, 0);
    camera.position.set(tgt.x + Math.sin(yaw) * Math.cos(pitch) * d, tgt.y + Math.sin(pitch) * d, tgt.z + Math.cos(yaw) * Math.cos(pitch) * d);
    if (view) { camera.position.set(view[0], view[1], view[2]); tgt.set(view[3], view[4], view[5]); }   // a fixed view (icons)
    camera.lookAt(tgt);
    renderer.render(scene, camera);
  }
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  setSpeed(0);
  requestAnimationFrame(frame);
  // for tests: drive the model frame by frame
  window.__lab = { S, dog, step, render, setSpeed, cam: (y, p, d) => { yaw = y; pitch = p; dist = d; }, view: v => { view = v; }, scene, stop: () => { window.requestAnimationFrame = () => 0; } };
})();
</script>
</body>
</html>
