<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пижон — скриншоты</title><style>
:root{--bg:#f4f4f1;--ink:#1d1f1c;--muted:#666b63;--card:#fff;--line:#dcdcd5}
@media (prefers-color-scheme:dark){:root{--bg:#141513;--ink:#e8e9e4;--muted:#9a9e95;--card:#1e201d;--line:#30332e}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px 64px}
h1{margin:0 0 4px}h2{margin:36px 0 12px;font-size:18px}p{color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
figure img{display:block;width:100%;height:auto}figcaption{padding:8px 10px;font-size:12px;color:var(--muted)}
figcaption b{display:block;color:var(--ink);font-size:12px}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.cast figure img{height:120px;object-fit:contain;background:repeating-conic-gradient(#0001 0 25%,#0000 0 50%) 0 0/16px 16px}
</style></head><body><main><h1>Барбершоп «Пижон»: все экраны</h1>

<h2>menu</h2><div class="grid"><figure><a href="001-menu-menu.jpg"><img loading="lazy" src="001-menu-menu.jpg" alt=""></a><figcaption><b>menu</b>Главное меню</figcaption></figure></div>
<h2>hero</h2><div class="grid"><figure><a href="002-hero-select.jpg"><img loading="lazy" src="002-hero-select.jpg" alt=""></a><figcaption><b>select</b>Выбор героя</figcaption></figure><figure><a href="003-hero-picked.jpg"><img loading="lazy" src="003-hero-picked.jpg" alt=""></a><figcaption><b>picked</b>Эрик выбран</figcaption></figure></div>
<h2>salons</h2><div class="grid"><figure><a href="004-salons-grid.jpg"><img loading="lazy" src="004-salons-grid.jpg" alt=""></a><figcaption><b>grid</b>Выбор салона, совет Айи на «Пижоне»</figcaption></figure></div>
<h2>c1-artem</h2><div class="grid"><figure><a href="005-c1-artem-line-narr.jpg"><img loading="lazy" src="005-c1-artem-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: «Пижон», вечерняя смена. Музыка, кирпич, полка с глиной и маслами. Эрик точит бритву и ждё</figcaption></figure><figure><a href="006-c1-artem-choices-d1.jpg"><img loading="lazy" src="006-c1-artem-choices-d1.jpg" alt=""></a><figcaption><b>choices-d1</b>Решение 1 — первый контакт</figcaption></figure><figure><a href="007-c1-artem-line-client.jpg"><img loading="lazy" src="007-c1-artem-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Артём: Здарова, бро. Мне коротко. Сколько ждать?</figcaption></figure><figure><a href="008-c1-artem-line-eric.jpg"><img loading="lazy" src="008-c1-artem-line-eric.jpg" alt=""></a><figcaption><b>line-eric</b>Эрик: Хай, бро! Нисколько — кресло твоё. Я Эрик. А тебя как?</figcaption></figure><figure><a href="009-c1-artem-line-aya.jpg"><img loading="lazy" src="009-c1-artem-line-aya.jpg" alt=""></a><figcaption><b>line-aya</b>Айя: Он сам задал тон: «здарова». В мужском зале можно ответить на его языке — имя и вопрос всё</figcaption></figure><figure><a href="010-c1-artem-feedback-d1.jpg"><img loading="lazy" src="010-c1-artem-feedback-d1.jpg" alt=""></a><figcaption><b>feedback-d1</b>В кресло</figcaption></figure><figure><a href="011-c1-artem-line-narr.jpg"><img loading="lazy" src="011-c1-artem-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: Артём снимает куртку, Эрик вешает на плечики.</figcaption></figure><figure><a href="012-c1-artem-line-client.jpg"><img loading="lazy" src="012-c1-artem-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Артём: Тёма. По бокам в ноль, сверху сантиметр. У меня в семь треня</figcaption></figure><figure><a href="013-c1-artem-line-eric.jpg"><img loading="lazy" src="013-c1-artem-line-eric.jpg" alt=""></a><figcaption><b>line-eric</b>Эрик: Успеем. Зачётная бэха, кстати. Твоя? Сам тонировал?</figcaption></figure><figure><a href="014-c1-artem-line-client.jpg"><img loading="lazy" src="014-c1-artem-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Артём: (впервые улыбается) Сам. А шрам — не от тачки, от бокса. Только не задень</figcaption></figure><figure><a href="015-c1-artem-line-eric.jpg"><img loading="lazy" src="015-c1-artem-line-eric.jpg" alt=""></a><figcaption><b>line-eric</b>Эрик: Расслабься. Я тут самый безопасный человек с бритвой</figcaption></figure><figure><a href="016-c1-artem-line-narr.jpg"><img loading="lazy" src="016-c1-artem-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: Во время фейда Артём крутит головой к телефону: там матч.</figcaption></figure><figure><a href="017-c1-artem-line-client.jpg"><img loading="lazy" src="017-c1-artem-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Артём: Слушай, а быстрее нельзя? Там наши проигрывают</figcaption></figure><figure><a href="018-c1-artem-choices-d2.jpg"><img loading="lazy" src="018-c1-artem-choices-d2.jpg" alt=""></a><figcaption><b>choices-d2</b>Решение 2 — клиент дёргается</figcaption></figure><figure><a href="019-c1-artem-line-narr.jpg"><img loading="lazy" src="019-c1-artem-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: Действие: молча придержать голову рукой.</figcaption></figure><figure><a href="020-c1-artem-line-aya.jpg"><img loading="lazy" src="020-c1-artem-line-aya.jpg" alt=""></a><figcaption><b>line-aya</b>Айя: Без слов он примет жест за вызов. Скажите, зачем.</figcaption></figure><figure><a href="021-c1-artem-feedback-d2.jpg"><img loading="lazy" src="021-c1-artem-feedback-d2.jpg" alt=""></a><figcaption><b>feedback-d2</b>Финал визита</figcaption></figure><figure><a href="022-c1-artem-line-narr.jpg"><img loading="lazy" src="022-c1-artem-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: Артём смотрит в зеркало, кивает без улыбки и молча расплачивается. Вернётся ли — неизвестн</figcaption></figure><figure><a href="023-c1-artem-line-aya.jpg"><img loading="lazy" src="023-c1-artem-line-aya.jpg" alt=""></a><figcaption><b>line-aya</b>Айя: Прямому клиенту — прямые слова и чёткие цифры. А лёгкая шутка делает из случайного клиента</figcaption></figure><figure><a href="024-c1-artem-final.jpg"><img loading="lazy" src="024-c1-artem-final.jpg" alt=""></a><figcaption><b>final</b>Следующий клиент</figcaption></figure><figure><a href="025-c1-artem-final-end.jpg"><img loading="lazy" src="025-c1-artem-final-end.jpg" alt=""></a><figcaption><b>final-end</b>Итог визита, низ</figcaption></figure></div>
<h2>c2-viktor</h2><div class="grid"><figure><a href="026-c2-viktor-line-narr.jpg"><img loading="lazy" src="026-c2-viktor-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: 11:00, запись. Тёмно-синий костюм, густая седая борода. Осматривает кирпичные стены, полку</figcaption></figure><figure><a href="027-c2-viktor-choices-d1.jpg"><img loading="lazy" src="027-c2-viktor-choices-d1.jpg" alt=""></a><figcaption><b>choices-d1</b>Решение 1 — проверка авторитета</figcaption></figure><figure><a href="028-c2-viktor-line-client.jpg"><img loading="lazy" src="028-c2-viktor-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Виктор Павлович: Виктор Павлович. Я записан. Вы, стало быть, мастер? Выглядите скорее как охранник ночного </figcaption></figure><figure><a href="029-c2-viktor-line-eric.jpg"><img loading="lazy" src="029-c2-viktor-line-eric.jpg" alt=""></a><figcaption><b>line-eric</b>Эрик: Ну, опыт у меня небольшой, но я стараюсь…</figcaption></figure><figure><a href="030-c2-viktor-line-aya.jpg"><img loading="lazy" src="030-c2-viktor-line-aya.jpg" alt=""></a><figcaption><b>line-aya</b>Айя: Неуверенность для руководителя — сигнал к контролю каждого движения.</figcaption></figure><figure><a href="031-c2-viktor-feedback-d1.jpg"><img loading="lazy" src="031-c2-viktor-feedback-d1.jpg" alt=""></a><figcaption><b>feedback-d1</b>В кресло</figcaption></figure><figure><a href="032-c2-viktor-line-narr.jpg"><img loading="lazy" src="032-c2-viktor-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: Виктор Павлович снимает пиджак, Эрик вешает на плечики.</figcaption></figure><figure><a href="033-c2-viktor-line-client.jpg"><img loading="lazy" src="033-c2-viktor-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Виктор Павлович: Бороду — короче и квадратом. Как у меня было двадцать лет назад</figcaption></figure><figure><a href="034-c2-viktor-line-eric.jpg"><img loading="lazy" src="034-c2-viktor-line-eric.jpg" alt=""></a><figcaption><b>line-eric</b>Эрик: Двадцать лет назад я детский сад возглавлял, так что покажите фото, если есть. А я посмотр</figcaption></figure><figure><a href="035-c2-viktor-line-client.jpg"><img loading="lazy" src="035-c2-viktor-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Виктор Павлович: (уголок рта дрогнул) Фото нет. Делайте, как я сказал</figcaption></figure><figure><a href="036-c2-viktor-line-narr.jpg"><img loading="lazy" src="036-c2-viktor-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: На щеках борода поредела: жёсткий квадрат откроет просветы. Мягкий квадрат их скроет.</figcaption></figure><figure><a href="037-c2-viktor-choices-d2.jpg"><img loading="lazy" src="037-c2-viktor-choices-d2.jpg" alt=""></a><figcaption><b>choices-d2</b>Решение 2 — клиент ошибается</figcaption></figure><figure><a href="038-c2-viktor-line-eric.jpg"><img loading="lazy" src="038-c2-viktor-line-eric.jpg" alt=""></a><figcaption><b>line-eric</b>Эрик: Виктор Павлович, решать вам. Один факт: на щеках борода стала реже, жёсткий квадрат покаже</figcaption></figure><figure><a href="039-c2-viktor-line-aya.jpg"><img loading="lazy" src="039-c2-viktor-line-aya.jpg" alt=""></a><figcaption><b>line-aya</b>Айя: Факт без спора, решение за ним. Авторитет цел, а вы — профессионал.</figcaption></figure><figure><a href="040-c2-viktor-feedback-d2.jpg"><img loading="lazy" src="040-c2-viktor-feedback-d2.jpg" alt=""></a><figcaption><b>feedback-d2</b>Финал визита</figcaption></figure><figure><a href="041-c2-viktor-line-narr.jpg"><img loading="lazy" src="041-c2-viktor-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: Виктор Павлович долго смотрит в зеркало и едва заметно кивает.</figcaption></figure><figure><a href="042-c2-viktor-line-client.jpg"><img loading="lazy" src="042-c2-viktor-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Виктор Павлович: Дельно. Для охранника — вовсе неплохо. Запишите меня через три недели</figcaption></figure><figure><a href="043-c2-viktor-line-aya.jpg"><img loading="lazy" src="043-c2-viktor-line-aya.jpg" alt=""></a><figcaption><b>line-aya</b>Айя: В барбершопе можно на «ты» — но не со всеми. С руководителем не спорят: дают факты и остав</figcaption></figure><figure><a href="044-c2-viktor-final.jpg"><img loading="lazy" src="044-c2-viktor-final.jpg" alt=""></a><figcaption><b>final</b>Следующий клиент</figcaption></figure><figure><a href="045-c2-viktor-final-end.jpg"><img loading="lazy" src="045-c2-viktor-final-end.jpg" alt=""></a><figcaption><b>final-end</b>Итог визита, низ</figcaption></figure></div>
<h2>c3-mark</h2><div class="grid"><figure><a href="046-c3-mark-line-narr.jpg"><img loading="lazy" src="046-c3-mark-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: 14:15. Платиновый блондин в сером костюме выходит из белой «Камри» и заканчивает разговор </figcaption></figure><figure><a href="047-c3-mark-choices-d1.jpg"><img loading="lazy" src="047-c3-mark-choices-d1.jpg" alt=""></a><figcaption><b>choices-d1</b>Решение 1 — просьба о скидке</figcaption></figure><figure><a href="048-c3-mark-line-client.jpg"><img loading="lazy" src="048-c3-mark-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Марк: Хай, бро! У меня через час переговоры. Сделаешь из меня миллионера? И скидочку новому клие</figcaption></figure><figure><a href="049-c3-mark-line-eric.jpg"><img loading="lazy" src="049-c3-mark-line-eric.jpg" alt=""></a><figcaption><b>line-eric</b>Эрик: Хай! Я Эрик. Миллионера — за сорок минут, по прайсу. Скидки не дам, зато вид будет такой, </figcaption></figure><figure><a href="050-c3-mark-line-aya.jpg"><img loading="lazy" src="050-c3-mark-line-aya.jpg" alt=""></a><figcaption><b>line-aya</b>Айя: Цена остаётся, а шутка переводит разговор на ценность. Переговорщик оценит ход.</figcaption></figure><figure><a href="051-c3-mark-feedback-d1.jpg"><img loading="lazy" src="051-c3-mark-feedback-d1.jpg" alt=""></a><figcaption><b>feedback-d1</b>В кресло</figcaption></figure><figure><a href="052-c3-mark-line-narr.jpg"><img loading="lazy" src="052-c3-mark-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: Марк снимает пиджак, Эрик вешает на плечики.</figcaption></figure><figure><a href="053-c3-mark-line-client.jpg"><img loading="lazy" src="053-c3-mark-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Марк: Марк. Слушай, а свой барбершоп не думал открыть? Я бы вошёл в долю…</figcaption></figure><figure><a href="054-c3-mark-line-eric.jpg"><img loading="lazy" src="054-c3-mark-line-eric.jpg" alt=""></a><figcaption><b>line-eric</b>Эрик: Камри у входа твоя? Зачётная — на такой переговоры сами выигрываются. А про барбершоп — сн</figcaption></figure><figure><a href="055-c3-mark-line-client.jpg"><img loading="lazy" src="055-c3-mark-line-client.jpg" alt=""></a><figcaption><b>line-client</b>Марк: Вот! Укладка к вечеру разваливается. На утренних встречах я бог, на вечерних — одуванчик</figcaption></figure><figure><a href="056-c3-mark-line-narr.jpg"><img loading="lazy" src="056-c3-mark-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: Клиент сам назвал проблему. На полке — матовая глина и спрей для объёма.</figcaption></figure><figure><a href="057-c3-mark-choices-d2.jpg"><img loading="lazy" src="057-c3-mark-choices-d2.jpg" alt=""></a><figcaption><b>choices-d2</b>Решение 2 — продажа ухода</figcaption></figure><figure><a href="058-c3-mark-line-eric.jpg"><img loading="lazy" src="058-c3-mark-line-eric.jpg" alt=""></a><figcaption><b>line-eric</b>Эрик: Бери всё: глину, спрей, шампунь и масло для бороды</figcaption></figure><figure><a href="059-c3-mark-line-aya.jpg"><img loading="lazy" src="059-c3-mark-line-aya.jpg" alt=""></a><figcaption><b>line-aya</b>Айя: Бороды у него нет. Впаривание договорщик чувствует лучше всех.</figcaption></figure><figure><a href="060-c3-mark-feedback-d2.jpg"><img loading="lazy" src="060-c3-mark-feedback-d2.jpg" alt=""></a><figcaption><b>feedback-d2</b>Финал визита</figcaption></figure><figure><a href="061-c3-mark-line-narr.jpg"><img loading="lazy" src="061-c3-mark-line-narr.jpg" alt=""></a><figcaption><b>line-narr</b>рассказчик: Марк смотрит в зеркало, кивает без улыбки и молча расплачивается. Вернётся ли — неизвестно</figcaption></figure><figure><a href="062-c3-mark-line-aya.jpg"><img loading="lazy" src="062-c3-mark-line-aya.jpg" alt=""></a><figcaption><b>line-aya</b>Айя: Договорщику не сдают цену — ему показывают ценность. Один точный совет продаёт лучше десят</figcaption></figure><figure><a href="063-c3-mark-final.jpg"><img loading="lazy" src="063-c3-mark-final.jpg" alt=""><
